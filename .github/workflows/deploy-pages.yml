# Manual deployment of the demo to GitHub Pages.
# Runs ONLY when triggered from the Actions tab ("Run workflow").
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Public values: the project URL and publishable key are shipped to every
          # browser by design (data is protected by sign-in and row-level security).
          # Repository variables, if set, take precedence. Never use a secret key here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xtbqnmndrlkxelritzzn.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Dns5Bn0XicE_xRWmi7p88g_N9wNwo3k' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
